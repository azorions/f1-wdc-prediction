# Model settings. Chosen by backtesting on 1997-2019 only (2020-2026 held out):
#   - rating priors + inflation: grid search on pre-season WDC log-loss (best 1.3365)
#   - dev_mult: in-season development drift, log-loss of predictions made 1/3, 1/2 and 3/4
#     through each season (0.0 best at 0.626; 0.5-2.0 within noise)
#   - inflation_new_rules: first season of new technical rules only (1998/2009/2014/2017):
#     log-loss fell 3.49 -> 2.80 from x0.5 to x2.0 and flattened after; higher values mostly
#     chase Brawn 2009. Does not affect 2027 (second year of the 2026 rules).
rating:
  sigma_driver: 0.8
  sigma_car: 0.5
  sigma_slope: 0.5
  sigma_rw: 0.15
  window: 3
  season_decay: 0.5
  outlier_min: 4.0
  outlier_k: 2.0
inflation: 0.5
dev_mult: 0.0
inflation_new_rules: 2.0
